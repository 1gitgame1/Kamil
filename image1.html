<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Близко - Зелёный Край</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4caf50;
            --secondary: #8bc34a;
            --bg: #0a0f0a;
            --txt: #fff;
            --txt-light: #c8e6c9;
            --grad: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--txt);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .image-container {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--grad);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .image-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .main-image {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            margin-bottom: 30px;
        }

        .main-image:hover {
            transform: scale(1.02);
        }

        .image-description {
            font-size: 1.2rem;
            color: var(--txt-light);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .back-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: var(--grad);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn:hover {
            transform: translateX(-50%) translateY(-5px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Мобильные устройства */
        @media (max-width: 768px) {
            .image-title {
                font-size: 2rem;
                margin-bottom: 20px;
            }

            .main-image {
                max-height: 60vh;
            }

            .image-description {
                font-size: 1rem;
                padding: 0 20px;
            }

            .close-btn {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }

            .back-btn {
                bottom: 20px;
                padding: 12px 25px;
                font-size: 0.9rem;
            }
        }

        /* Очень маленькие экраны */
        @media (max-width: 480px) {
            .image-title {
                font-size: 1.5rem;
            }

            .main-image {
                max-height: 50vh;
            }

            .image-description {
                font-size: 0.9rem;
            }

            .close-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="image-container">
        <button class="close-btn" onclick="closeImage()" aria-label="Закрыть">
            <i class="fas fa-times"></i>
        </button>

        <h1 class="image-title">Близко</h1>

        <img src="img/1.png" alt="Магазин Фото 1" class="main-image">

        <p class="image-description">Зеленый край — тут и свежесть, и уют. Овощи, фрукты — для всех вас тут ждут!</p>

        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Вернуться на главную
        </a>
    </div>

    <script>
        function closeImage() {
            // Анимация исчезновения
            document.querySelector('.image-container').style.animation = 'fadeOut 0.3s ease-in-out';

            setTimeout(() => {
                // Возврат на главную страницу
                if (document.referrer && document.referrer.includes('index.html')) {
                    window.history.back();
                } else {
                    window.location.href = 'index.html';
                }
            }, 300);
        }

        // Закрытие по клавише Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImage();
            }
        });

        // Добавляем стиль для анимации исчезновения
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from {
                    opacity: 1;
                    transform: scale(1);
                }
                to {
                    opacity: 0;
                    transform: scale(0.9);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
